name: Compilar MantellaDialogue.dll

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar Ninja
        run: choco install ninja -y

      - name: Caché binaria de vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configurar CMake
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        shell: pwsh
        run: |
          # actions/cache no crea la carpeta si no hay entrada previa y vcpkg
          # exige que VCPKG_DEFAULT_BINARY_CACHE sea un directorio existente.
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-binary-cache" | Out-Null
          # El bundle precompilado del SDK se enlazó contra otro fmt y produce
          # LNK2001. Sin GITHUB_ACTIONS en el entorno, Prebuilt.cmake cae a fuente.
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          $vcpkg = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          Write-Host "Usando vcpkg en: $vcpkg"
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DBUILD_TESTS=OFF

      - name: Compilar
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        shell: pwsh
        run: cmake --build build --config Release

      - name: Localizar DLL
        id: find_dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter "MantellaDialogue.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "No se encontró MantellaDialogue.dll en build/"
            exit 1
          }
          Write-Host "DLL: $($dll.FullName)"
          # Write-Host no se redirige con >> (flujo de información); Add-Content sí escribe.
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($dll.FullName)"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MantellaDialogue.dll
          # Glob independiente del paso anterior: si el output quedara vacío, la
          # subida igual funciona.
          path: build/**/MantellaDialogue.dll
